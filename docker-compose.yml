services:
  tlsbench:
    build: .
    image: ${IMAGE:-tlsbench:dev}
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      HTTP_ADDR: ":8080"
      HTTPS_ADDR: ":8443"
      DATA_DIR: /data
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE: /certs/tls.key
      TLS_CA_FILE: /certs/ca.crt
      TLS_CA_DIR: /etc/pki/internal-ca
      TLS_CA_BUNDLE_FILE: /certs/ca-bundle.pem
      TLS_DNS_NAMES: localhost
      RESULTS_LOG: /data/results/runs.jsonl
    volumes:
      - tlsbench-data:/data
      - tlsbench-certs:/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tlsbench-data:
  tlsbench-certs:
