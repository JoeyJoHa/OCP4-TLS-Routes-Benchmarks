apiVersion: apps/v1
kind: Deployment
metadata:
  name: tlsbench
  namespace: tlsbench
  labels:
    app.kubernetes.io/name: tlsbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tlsbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tlsbench
    spec:
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tlsbench
          image: tlsbench:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: HTTPS_ADDR
              value: ":8443"
            - name: DATA_DIR
              value: /data
            - name: RESULTS_LOG
              value: /data/results/runs.jsonl
            - name: TLS_CERT_FILE
              value: /certs/tls.crt
            - name: TLS_KEY_FILE
              value: /certs/tls.key
            - name: TLS_CA_FILE
              value: /certs/ca.crt
            - name: TLS_CA_DIR
              value: /etc/pki/internal-ca
            - name: TLS_CA_BUNDLE_FILE
              value: /certs/ca-bundle.pem
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TLS_DNS_NAMES
              value: "localhost,tlsbench,tlsbench.tlsbench.svc,tlsbench.tlsbench.svc.cluster.local"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
            - name: internal-ca
              mountPath: /etc/pki/internal-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tlsbench-data
        - name: certs
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: tlsbench-internal-ca
